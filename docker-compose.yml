# Project and container names are kept as historical 'risuai-nodeonly' so existing
# v1.5.x users transition without port/container collisions. These compose
# internals stay stable on purpose so existing data volumes are reused.
name: risuai-nodeonly

services:
  risuai:
    container_name: risuai-nodeonly
    image: ghcr.io/tegy1117/kei-risu:latest
    restart: always
    ports:
      - 6001:6001
    volumes:
      - risuai-save:/app/save

volumes:
  risuai-save:
    # Explicit name preserves the existing volume from v1.5.0 (project name was 'risuai-nodeonly').
    # Changing this name would create an empty save folder for existing users.
    name: risuai-nodeonly_risuai-save
